# WristbandsNG – Nginx Load Balancer Configuration
# Handles 100,000+ concurrent users via upstream load balancing

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=register:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream – Gunicorn workers (scale by adding more servers)
    upstream wristbandsng_app {
        least_conn;                          # Route to least-busy worker
        server 127.0.0.1:8001 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8002 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8003 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8004 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name wristbands.ng www.wristbands.ng;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name wristbands.ng www.wristbands.ng;

        # SSL
        ssl_certificate     /etc/ssl/certs/wristbands.crt;
        ssl_certificate_key /etc/ssl/private/wristbands.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Static files – served directly by Nginx (no Django overhead)
        location /static/ {
            alias /var/www/wristbandsng/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /var/www/wristbandsng/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Registration endpoint – stricter rate limit
        location /registrations/ {
            limit_req zone=register burst=10 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://wristbandsng_app;
            include /etc/nginx/proxy_params;
        }

        # API / general – standard rate limit
        location / {
            limit_req zone=api burst=50 nodelay;
            limit_conn conn_limit 50;
            proxy_pass http://wristbandsng_app;
            include /etc/nginx/proxy_params;
        }
    }
}
