<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – WristbandsNG</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
</head>
<body class="dash-body d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-bg-shapes">
    <div class="login-shape s1"></div>
    <div class="login-shape s2"></div>
    <div class="login-shape s3"></div>
  </div>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6">
        <div class="text-center mb-4">
          <div class="login-brand-icon mx-auto mb-3"><i class="bi bi-lightning-charge-fill"></i></div>
          <h4 class="text-white fw-800">Wristbands<span style="color:#e6573f">NG</span></h4>
          <p class="text-muted small">Admin Portal</p>
        </div>
        <div class="dash-card p-4 p-lg-5">
          <h5 class="text-white fw-700 mb-1">Welcome back</h5>
          <p class="text-muted small mb-4">Sign in to manage your events</p>

          {% if messages %}
          {% for msg in messages %}
          <div class="alert dash-alert dash-alert-{{ msg.tags }} d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-exclamation-circle-fill"></i>{{ msg }}
          </div>
          {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label dash-label">Username</label>
              <div class="input-group ep-input-group">
                <span class="input-group-text ep-input-addon"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control ep-input-dark" placeholder="Enter username" required autofocus />
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label dash-label">Password</label>
              <div class="input-group ep-input-group">
                <span class="input-group-text ep-input-addon"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="passwordInput" class="form-control ep-input-dark" placeholder="Enter password" required />
                <button type="button" class="input-group-text ep-input-addon" id="togglePassword" style="cursor:pointer">
                  <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-ep-primary w-100 py-3 fw-600">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
          <p class="text-center text-muted small mt-4 mb-0">
            <i class="bi bi-shield-lock me-1"></i>Secured admin access only
          </p>
        </div>
        <p class="text-center mt-3">
          <a href="{% url 'home' %}" class="text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to site</a>
        </p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });
  </script>
</body>
</html>
