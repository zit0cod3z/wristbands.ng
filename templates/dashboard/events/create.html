{% extends 'dashboard/base.html' %}
{% block title %}Create Event{% endblock %}
{% block page_title %}Create New Event{% endblock %}
{% block nav_create %}active{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-9">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row g-4">

        <div class="col-12">
          <div class="dash-card">
            <div class="dash-card-header"><h6 class="dash-card-title"><i class="bi bi-info-circle me-2 text-purple"></i>Basic Information</h6></div>
            <div class="dash-card-body">
              <div class="row g-3">
                <div class="col-md-8">
                  <label class="form-label dash-label">Event Title <span class="text-danger">*</span></label>
                  <input type="text" name="title" class="form-control ep-input-dark" placeholder="e.g. Summer Music Festival 2025" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label dash-label">Event Type <span class="text-danger">*</span></label>
                  <select name="event_type" class="form-select ep-input-dark" required>
                    {% for val, label in event_types %}
                    <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label dash-label">Description <span class="text-danger">*</span></label>
                  <textarea name="description" class="form-control ep-input-dark" rows="4" placeholder="Describe your event..." required></textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label dash-label">Banner Image</label>
                  <input type="file" name="banner" class="form-control ep-input-dark" accept="image/*" />
                </div>
                <div class="col-md-3">
                  <label class="form-label dash-label">Theme Color</label>
                  <div class="d-flex align-items-center gap-2">
                    <input type="color" name="color_theme" value="#ac2376" class="form-control form-control-color ep-color-input" />
                    <span class="text-muted small">Pick a color</span>
                  </div>
                </div>
                <div class="col-md-3">
                  <label class="form-label dash-label">Status</label>
                  <select name="status" class="form-select ep-input-dark">
                    <option value="draft">Draft</option>
                    <option value="published">Published</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="dash-card">
            <div class="dash-card-header"><h6 class="dash-card-title"><i class="bi bi-geo-alt me-2 text-blue"></i>Location & Schedule</h6></div>
            <div class="dash-card-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label dash-label">Venue Name <span class="text-danger">*</span></label>
                  <input type="text" name="venue" class="form-control ep-input-dark" placeholder="e.g. Madison Square Garden" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label dash-label">Address</label>
                  <input type="text" name="address" class="form-control ep-input-dark" placeholder="Street address" />
                </div>
                <div class="col-md-6">
                  <label class="form-label dash-label">City</label>
                  <input type="text" name="city" class="form-control ep-input-dark" placeholder="City" />
                </div>
                <div class="col-md-6">
                  <label class="form-label dash-label">Country</label>
                  <input type="text" name="country" class="form-control ep-input-dark" placeholder="Country" />
                </div>
                <div class="col-md-4">
                  <label class="form-label dash-label">Start Date & Time <span class="text-danger">*</span></label>
                  <input type="datetime-local" name="start_date" class="form-control ep-input-dark" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label dash-label">End Date & Time <span class="text-danger">*</span></label>
                  <input type="datetime-local" name="end_date" class="form-control ep-input-dark" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label dash-label">Registration Deadline</label>
                  <input type="datetime-local" name="registration_deadline" class="form-control ep-input-dark" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="dash-card">
            <div class="dash-card-header"><h6 class="dash-card-title"><i class="bi bi-sliders me-2 text-orange"></i>Settings</h6></div>
            <div class="dash-card-body">
              <div class="row g-3 align-items-center">
                <div class="col-md-4">
                  <label class="form-label dash-label">Capacity <span class="text-muted small">(0 = unlimited)</span></label>
                  <input type="number" name="capacity" value="0" min="0" class="form-control ep-input-dark" />
                </div>
                <div class="col-md-4 d-flex align-items-center gap-3 pt-4">
                  <div class="form-check ep-form-check-dark">
                    <input class="form-check-input" type="checkbox" name="is_featured" id="isFeatured" />
                    <label class="form-check-label text-muted" for="isFeatured">Feature on homepage</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 d-flex gap-3 justify-content-end">
          <a href="{% url 'dashboard:event_list' %}" class="btn btn-ep-ghost px-4">Cancel</a>
          <button type="submit" class="btn btn-ep-primary px-5">
            <i class="bi bi-arrow-right me-2"></i>Save & Build Form
          </button>
        </div>

      </div>
    </form>
  </div>
</div>
{% endblock %}
